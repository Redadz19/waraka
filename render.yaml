services:
  - type: web
    name: waraka-licensing-api
    region: frankfurt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: LICENSE_PRIVATE_KEY_B64
        sync: false
      - key: LICENSE_PUBLIC_KEY_B64
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OFFLINE_GRACE_DAYS
        value: "14"
      - key: RECHECK_DAYS
        value: "7"
      - key: LICENSE_SERIAL_ENCRYPTION_KEY
        sync: false
      - key: CHARGILY_API_SECRET_KEY
        sync: false
      - key: CHARGILY_MODE
        value: test
      - key: WARAKA_PRICE_DZD
        value: "0"
      - key: CHARGILY_FEES_ALLOCATION
        value: merchant
      - key: PUBLIC_BASE_URL
        sync: false
